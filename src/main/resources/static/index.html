<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秒杀商品列表</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/util.js"></script>
</head>
<body>
<div id="app" class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">秒杀商品</h3>
    <span class="badge bg-secondary">当前用户: {{ phone }}</span>
  </div>

  <div class="row g-3">
    <div class="col-md-4" v-for="s in list" :key="s.seckillId">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ s.name }}</h5>
          <p class="card-text">库存: <span class="badge bg-info">{{ s.stock }}</span></p>
          <p class="card-text text-muted small mb-3">
            开始: {{ fmtDateTime(fmt(s.startTime)) }}
          </p>
          <a :href="'detail.html?id=' + s.seckillId" class="btn btn-primary mt-auto">查看详情</a>
        </div>
      </div>
    </div>
div>

  <p v-if="!loading && list.length === 0" class="text-muted mt-4">暂无秒杀商品</p>
  <p v-if="loading" class="text-muted mt-4">加载中...</p>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return { list: [], phone: getPhone(), loading: true };
  },
  methods: { fmt, fmtDateTime },
  async mounted() {
    try {
      const resp = await getJSON('/seckill/list');
      this.list = resp.data || [];
    } finally {
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
